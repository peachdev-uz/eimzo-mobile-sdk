pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // E-IMZO Mobile SDK from this repo's own maven/ directory, so the
        // example builds with the SDK version of the checkout. In your app use
        // the official public Maven repository instead:
        // maven { url 'https://raw.githubusercontent.com/peachdev-uz/eimzo-mobile-sdk/main/maven/' }
        maven { url uri('../../maven') }
    }
}

rootProject.name = "EimzoExample"
include ':app'
